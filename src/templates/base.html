<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltiUI - {% block title %}Event Log{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 20px;
            padding-bottom: 20px;
        }
        .logout-btn {
            color: #dc3545;
        }
        .logout-btn:hover {
            color: #bb2d3b;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="container mx-auto px-4 max-w-7xl">
        <!-- Navigation Bar -->
        <nav class="bg-white rounded-lg shadow-md p-4 mb-8 flex justify-between items-center">
            <div class="flex items-center space-x-6">
                <a href="/" class="text-xl font-bold text-gray-800 flex items-center">
                    UltiUI
                    <span id="printer-indicator" class="ml-2 w-2.5 h-2.5 rounded-full inline-block" style="background:#9ca3af"></span>
                    <span id="printer-indicator-label" class="ml-1.5 text-xs font-normal text-gray-400 hidden sm:inline">--</span>
                </a>
                <a href="/print-jobs" class="text-gray-700 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white">Print Jobs</a>
                <a href="/event-log" class="text-gray-700 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white">Event Log</a>
                <a href="/diagnostics" class="text-gray-700 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white">Diagnostics</a>
                <a href="/settings" class="text-gray-700 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white">Settings</a>
            </div>
            <div>
                <a href="/logout" class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Logout
                </a>
            </div>
        </nav>
        
        {% block content %}{% endblock %}
    </div>
    
    <script>
        let printerIndicatorInterval;
        function updatePrinterIndicator() {
            fetch('/api/printer-stats')
                .then(r => r.json())
                .then(d => {
                    const dot = document.getElementById('printer-indicator');
                    const label = document.getElementById('printer-indicator-label');
                    if (!dot) return;
                    const status = (d.status || '').toLowerCase();
                    if (status === 'printing') {
                        dot.style.background = '#3b82f6';
                        dot.style.animation = 'none';
                        label.textContent = 'Printing';
                    } else if (status === 'idle') {
                        dot.style.background = '#9ca3af';
                        dot.style.animation = 'none';
                        label.textContent = 'Idle';
                    } else if (status === 'error' || status === 'maintenance') {
                        dot.style.background = '#ef4444';
                        dot.style.animation = 'none';
                        label.textContent = status;
                    } else {
                        dot.style.background = '#22c55e';
                        dot.style.animation = 'pulse-dot 0.8s ease-in-out infinite';
                        label.textContent = 'Traveling';
                    }
                })
                .catch(() => {
                    const dot = document.getElementById('printer-indicator');
                    if (dot) { dot.style.background = '#ef4444'; dot.style.animation = 'none'; }
                });
        }
        document.addEventListener('DOMContentLoaded', () => {
            updatePrinterIndicator();
            printerIndicatorInterval = setInterval(updatePrinterIndicator, 2000);
        });
        window.addEventListener('beforeunload', () => clearInterval(printerIndicatorInterval));
    </script>
    <style>
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
        }
    </style>
    
    {% block scripts %}{% endblock %}
</body>
</html>
